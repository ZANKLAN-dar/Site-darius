<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaires</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f4ebe3, #e8d6c2);
            color: #3b2416;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #5a2d0c;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* CONTENEUR FORMULAIRE */
        form {
            width: 60%;
            margin: 30px auto;
            background: linear-gradient(145deg, #fff7ef, #ead4bd);
            padding: 30px;
            border-radius: 15px;
            box-shadow:
                8px 8px 18px rgba(0, 0, 0, 0.25),
               -8px -8px 18px rgba(255, 255, 255, 0.6);
        }

        p {
            font-size: 16px;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        /* INPUTS & SELECT */
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #a47148;
            font-size: 15px;
            background-color: #fffaf5;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #5a2d0c;
            box-shadow: 0 0 8px rgba(90, 45, 12, 0.4);
        }

        /* FIELDSET */
        fieldset {
            border: 2px solid #8b4513;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fffaf5;
        }

        legend {
            font-weight: bold;
            padding: 0 10px;
            color: #5a2d0c;
        }

        /* RADIOS */
        input[type="radio"] {
            margin-right: 8px;
        }

        /* BOUTONS */
        input[type="submit"],
        input[type="reset"] {
            background: linear-gradient(145deg, #8b4513, #a0522d);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 15px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        input[type="reset"] {
            background: linear-gradient(145deg, #777, #555);
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 14px rgba(0,0,0,0.35);
        }

        /* TITRES TEXTE */
        .titre-formulaire {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-top: 40px;
            color: #4a2610;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

<h2 class="titre-formulaire">Formulaire – Pays d'origine</h2>

<form method="post" action="traitement.php">
    <p>
        <label for="pays">Dans quel pays habitez-vous ?</label>
        <select name="pays" id="pays">
            <option value="france">France</option>
            <option value="espagne">Espagne</option>
            <option value="italie">Italie</option>
            <option value="royaume-uni">Royaume-Uni</option>
            <option value="canada" selected>Canada</option>
            <option value="etats-unis">États-Unis</option>
            <option value="chine">Chine</option>
            <option value="japon">Japon</option>
        </select>
    </p>
</form>

<h2 class="titre-formulaire">Formulaire de souhait</h2>

<form method="post" action="cible_formulaire.php">

    <fieldset>
        <legend>Vos coordonnées</legend>

        <label for="nom">Nom</label>
        <input type="text" name="nom" id="nom" tabindex="10">

        <label for="prenom">Prénom</label>
        <input type="text" name="prenom" id="prenom" tabindex="20">

        <label for="email">E-mail</label>
        <input type="text" name="email" id="email" tabindex="30">
    </fieldset>

    <fieldset>
        <legend>Votre souhait</legend>

        <p>
            <input type="radio" name="souhait" value="riche" id="riche" tabindex="40">
            <label for="riche">Être riche</label><br>

            <input type="radio" name="souhait" value="celebre" id="celebre" tabindex="50">
            <label for="celebre">Être célèbre</label><br>

            <input type="radio" name="souhait" value="intelligent" id="intelligent" tabindex="60">
            <label for="intelligent">Être <strong>encore</strong> plus intelligent</label><br>

            <input type="radio" name="souhait" value="autre" id="autre" tabindex="70">
            <label for="autre">Autre…</label>
        </p>

        <textarea name="precisions" id="precisions" cols="40" rows="4" tabindex="80"
            placeholder="Précisez votre souhait ici..."></textarea>
    </fieldset>

    <p style="text-align:center;">
        <input type="submit" value="Envoyer">
        <input type="reset" value="Réinitialiser">
    </p>

</form>

</body>
</html>
