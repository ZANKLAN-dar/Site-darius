<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Site Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #f3e6d8, #e6cbb1);
            overflow: hidden;
        }

        /* CONTENEUR GLOBAL */
        .container {
            display: flex;
            height: 100vh;
        }

        /* MENU */
        nav {
            width: 260px;
            background: linear-gradient(180deg, #5a2d0c, #8b4513);
            padding: 30px 20px;
            box-shadow: 6px 0 15px rgba(0,0,0,0.3);
            animation: slideIn 1s ease;
        }

        nav h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        nav a {
            display: block;
            text-decoration: none;
            color: #fff;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        nav a:hover {
            background: rgba(255,255,255,0.25);
            transform: translateX(10px);
        }

        /* CONTENU */
        main {
            flex: 1;
            background-color: #fdf7f2;
            animation: fadeIn 1.2s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fdf7f2;
        }

        /* ANIMATIONS */
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- MENU -->
    <nav>
        <h1>Mon Site Web</h1>
        <a href="page1.html" target="contenu"> -Page 1-</a>
        <a href="page2.html" target="contenu"> -Page 2-</a>
        <a href="page3.html" target="contenu"> -Page 3-</a>
        <a href="page4.html" target="contenu"> -Page 4-</a>
        <a href="CV1.html"    target="contenu"> -CV pro-</a>
        <a href="Tableaux.html" target="contenu"> -Tableaux-</a>
        <a href="Formulaire.html" target="contenu"> -Formulaire-</a>
    </nav>

    <!-- CONTENU -->
    <main>
        <iframe name="contenu" src="sololean.html"></iframe>
    </main>

</div>

</body>
</html>
